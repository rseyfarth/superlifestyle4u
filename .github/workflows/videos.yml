name: Videos aktualisieren
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: ["videos.json"]
permissions:
  contents: write
concurrency: videos
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_videos.py && python build.py
      - run: |
          git config user.name "superlifestyle4u-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Videos aktualisiert" && git push)
